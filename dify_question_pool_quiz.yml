app:
  description: アプリ側でDBから取得した問題を、学習者表示用JSONに整形する
  icon: 📦
  icon_background: '#E3F2FD'
  icon_type: emoji
  mode: advanced-chat
  name: 問題プール出題整形
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.10@7ca552fb9e48caa4deddfdef5aa71c200d06d03c26c2e8bb428b3250101b9cb3
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-format
      source: start
      sourceHandle: source
      target: llm_format
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: llm
        targetType: answer
      id: format-answer
      source: llm_format
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        selected: false
        title: ユーザー入力
        type: start
        variables:
        - default: ''
          hint: question_pool の主キー
          label: question_pool_id
          options: []
          placeholder: uuid
          required: false
          type: text-input
          variable: question_pool_id
        - default: ''
          hint: 問題文
          label: question
          options: []
          placeholder: 問題文
          required: true
          type: paragraph
          variable: question
        - default: ''
          hint: JSON配列文字列
          label: choices
          options: []
          placeholder: "[\"A\",\"B\",\"C\",\"D\"]"
          required: true
          type: paragraph
          variable: choices
        - default: ''
          hint: 0始まり
          label: correct_index
          options: []
          placeholder: '1'
          required: true
          type: text-input
          variable: correct_index
        - default: ''
          hint: 正答本文
          label: correct_answer
          options: []
          placeholder: SMTP
          required: true
          type: text-input
          variable: correct_answer
        - default: ''
          hint: 解説
          label: explanation
          options: []
          placeholder: 解説
          required: false
          type: paragraph
          variable: explanation
        - default: '3'
          hint: 1〜5
          label: difficulty_level
          options: []
          placeholder: '3'
          required: false
          type: text-input
          variable: difficulty_level
        - default: general
          hint: 分類名
          label: question_group
          options: []
          placeholder: mail_protocol
          required: false
          type: text-input
          variable: question_group
      height: 370
      id: start
      position:
        x: 80
        y: 190
      positionAbsolute:
        x: 80
        y: 190
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-format
          role: system
          text: |-
            あなたは出題整形担当です。

            入力:
            - question_pool_id: {{#start.question_pool_id#}}
            - question: {{#start.question#}}
            - choices: {{#start.choices#}}
            - correct_index: {{#start.correct_index#}}
            - correct_answer: {{#start.correct_answer#}}
            - explanation: {{#start.explanation#}}
            - difficulty_level: {{#start.difficulty_level#}}
            - question_group: {{#start.question_group#}}

            目的:
            これらを学習者表示用のJSONへ整形してください。

            出力ルール:
            - JSONオブジェクトだけを返す
            - Markdownや補足文は禁止
            - type は "quiz"
            - public の中に question と choices を入れる
            - answerIndex は 0 始まり整数

            出力形式:
            {
              "type": "quiz",
              "questionPoolId": "uuid",
              "public": {
                "question": "問題文",
                "choices": ["A", "B", "C", "D"]
              },
              "answerIndex": 1,
              "answer": "正答",
              "explanation": "解説",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol"
            }
        selected: false
        title: 出題JSON整形
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_format
      position:
        x: 430
        y: 280
      positionAbsolute:
        x: 430
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#llm_format.text#}}'
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 103
      id: answer
      position:
        x: 760
        y: 272
      positionAbsolute:
        x: 760
        y: 272
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 0.9
