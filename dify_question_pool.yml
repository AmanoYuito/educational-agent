app:
  description: 問題プール保存前提の4択問題を多段LLMで生成する
  icon: 🧠
  icon_background: '#E8F0FE'
  icon_type: emoji
  mode: advanced-chat
  name: 問題プール生成
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.10@7ca552fb9e48caa4deddfdef5aa71c200d06d03c26c2e8bb428b3250101b9cb3
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-question
      source: start
      sourceHandle: source
      target: llm_question
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: question-correct
      source: llm_question
      sourceHandle: source
      target: llm_correct
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: correct-wrongs
      source: llm_correct
      sourceHandle: source
      target: llm_wrongs
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: wrongs-critique
      source: llm_wrongs
      sourceHandle: source
      target: llm_critique
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: critique-finalize
      source: llm_critique
      sourceHandle: source
      target: llm_finalize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: llm
        targetType: answer
      id: finalize-answer
      source: llm_finalize
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        selected: false
        title: ユーザー入力
        type: start
        variables:
        - default: ''
          hint: 出題したい主題
          label: topic
          options: []
          placeholder: SMTP
          required: false
          type: text-input
          variable: topic
        - default: ''
          hint: 直前までの学習内容や会話要約
          label: conversation_context
          options: []
          placeholder: 直前会話の要約
          required: false
          type: paragraph
          variable: conversation_context
        - default: ''
          hint: 教材本文や補足資料
          label: source_context
          options: []
          placeholder: 教材本文
          required: false
          type: paragraph
          variable: source_context
        - default: '3'
          hint: 1〜5
          label: difficulty_level
          options: []
          placeholder: '3'
          required: false
          type: text-input
          variable: difficulty_level
        - default: ''
          hint: 苦手分析用の短い分類名
          label: question_group
          options: []
          placeholder: mail_protocol
          required: false
          type: text-input
          variable: question_group
      height: 244
      id: start
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.6
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-question
          role: system
          text: |-
            あなたは問題文設計担当です。

            入力:
            - topic: {{#start.topic#}}
            - conversation_context: {{#start.conversation_context#}}
            - source_context: {{#start.source_context#}}
            - difficulty_level: {{#start.difficulty_level#}}
            - question_group: {{#start.question_group#}}

            目的:
            学習者向けの4択問題の土台を1問だけ設計してください。

            出力ルール:
            - JSONだけを返す
            - Markdownや補足文は禁止
            - まだ選択肢は作らない
            - 問題は topic と source_context に忠実にする
            - difficultyLevel は 1〜5 の整数
            - questionGroup が空なら短い分類名を自分で補う

            出力形式:
            {
              "question": "問題文",
              "questionIntent": "何を確認したいか",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol"
            }
        selected: false
        title: 問題文生成
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_question
      position:
        x: 390
        y: 168
      positionAbsolute:
        x: 390
        y: 168
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-correct
          role: system
          text: |-
            あなたは正答生成担当です。

            前段のJSON:
            {{#llm_question.text#}}

            目的:
            問題文に対する正答を1つ作り、簡潔で正確な解説も作ってください。

            出力ルール:
            - JSONだけ
            - correctAnswer は choices にそのまま使える短い表現にする
            - explanation は学習者の復習用にわかりやすくする

            出力形式:
            {
              "question": "問題文",
              "questionIntent": "確認したい内容",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol",
              "correctAnswer": "正答",
              "explanation": "解説"
            }
        selected: false
        title: 正答生成
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_correct
      position:
        x: 700
        y: 168
      positionAbsolute:
        x: 700
        y: 168
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.8
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-wrongs
          role: system
          text: |-
            あなたは誤答生成担当です。

            前段のJSON:
            {{#llm_correct.text#}}

            目的:
            正答と紛らわしすぎず、ただし学習上意味のある誤答を3つ作ってください。

            出力ルール:
            - JSONだけ
            - wrongAnswers は3件
            - correctAnswer を含めない
            - 「全部正しい」「どれでもない」のような雑な誤答は禁止

            出力形式:
            {
              "question": "問題文",
              "questionIntent": "確認したい内容",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol",
              "correctAnswer": "正答",
              "wrongAnswers": ["誤答1", "誤答2", "誤答3"],
              "explanation": "解説"
            }
        selected: false
        title: 誤答生成
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_wrongs
      position:
        x: 1010
        y: 168
      positionAbsolute:
        x: 1010
        y: 168
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-critique
          role: system
          text: |-
            あなたは自己批判担当です。

            前段のJSON:
            {{#llm_wrongs.text#}}

            目的:
            問題の品質を点検し、必要なら修正してください。

            チェック項目:
            - 問題文と正答が整合しているか
            - 誤答3件が不自然でないか
            - 正答が一意か
            - 解説が正答を支えているか
            - difficultyLevel と questionGroup が妥当か

            出力ルール:
            - JSONだけ
            - 修正後の確定案を返す
            - critique は短く残してよい

            出力形式:
            {
              "question": "問題文",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol",
              "correctAnswer": "正答",
              "wrongAnswers": ["誤答1", "誤答2", "誤答3"],
              "explanation": "解説",
              "critique": "自己批判メモ"
            }
        selected: false
        title: 自己批判
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_critique
      position:
        x: 1320
        y: 168
      positionAbsolute:
        x: 1320
        y: 168
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-finalize
          role: system
          text: |-
            あなたは最終整形担当です。

            前段のJSON:
            {{#llm_critique.text#}}

            目的:
            アプリが question_pool に保存できる最終JSONを返してください。

            出力ルール:
            - JSONオブジェクトだけ
            - choices は correctAnswer を含む4件にする
            - correctIndex は 0 始まり
            - wrongAnswers は誤答3件
            - questionType は "multiple_choice"
            - aiOutput には要約だけ入れる

            出力形式:
            {
              "questionType": "multiple_choice",
              "question": "問題文",
              "choices": ["選択肢1", "選択肢2", "選択肢3", "選択肢4"],
              "correctIndex": 0,
              "correctAnswer": "正答",
              "wrongAnswers": ["誤答1", "誤答2", "誤答3"],
              "explanation": "解説",
              "difficultyLevel": 3,
              "questionGroup": "mail_protocol",
              "aiOutput": {
                "pipeline": "question->correct->wrongs->critique->finalize"
              }
            }
        selected: false
        title: 最終整形
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm_finalize
      position:
        x: 1630
        y: 168
      positionAbsolute:
        x: 1630
        y: 168
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#llm_finalize.text#}}'
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 103
      id: answer
      position:
        x: 1930
        y: 160
      positionAbsolute:
        x: 1930
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 0.6
