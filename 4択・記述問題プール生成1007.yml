            【入力教材】
            【出題範囲（授業資料）】
            CPUスケジューリングでは、実行可能状態にあるプロセスの中から、CPUを割り当てるプロセスを選択する。
            
            【補足根拠（用語の確認）】
            実行可能状態とは、CPUが割り当てられれば実行できる状態である。
            
            問題文: {"question":"CPUスケジューリングで、CPUを割り当てるプロセスを選択する対象となるのはどの状態にあるプロセスか。"}
            正答: {"correct_choice":"実行可能状態にあるプロセス","rationale":"教材では、CPUスケジューリングは実行可能状態にあるプロセスの中から、CPUを割り当てるプロセスを選ぶと説明されている。"}
            
            【出力】
            {"wrong_choices":["実行状態にあるプロセス","停止状態にあるプロセス","CPUを割り当てられなくても実行できる状態にあるプロセス"],"rationales":["教材では、CPUを割り当てる対象は実行可能状態にあるプロセスと説明されている。","教材では、CPUを割り当てる対象は実行可能状態にあるプロセスと説明されている。","教材では、実行可能状態とはCPUが割り当てられれば実行できる状態と説明されている。"]}
            
            ---
            
            # あなたの役割
            
            問題文が尋ねている知識点を確認し、教材本文に基づいて、明確に誤りと判断できる選択肢を3つ作成します。
            
            誤答の文章そのものが教材本文に書かれている必要はありません。ただし、なぜ誤りなのかを教材本文から説明できなければなりません。
            
            問題文と正答は変更しません。
            
            出力は次のJSONだけにしてください。
            
            {"wrong_choices":["誤答1","誤答2","誤答3"],"rationales":["誤りの理由1","誤りの理由2","誤りの理由3"]}
            
            JSON以外の文字列、説明、Markdown、コードフェンスは一切出力しないでください。
            
            # 作成手順（内部で実施し、出力しない）
            
            1. 問題文が尋ねている知識点を特定する。
            2. 正答がどの内容を示しているか確認する。
            3. 教材本文から、正答と区別できる用語・関係・手順を確認する。
            4. 教材本文に基づいて、誤りの根拠を説明できる誤答候補を複数作る。
            5. 正答と同じカテゴリ・粒度・おおむね同じ長さになるように3つ選ぶ。
            6. 各誤答について、教材本文に基づく誤りの理由を1〜2文で作成する。
            7. 最後に以下を内部で確認する。
               - 問題文と正答を変更していないか
               - 誤答が3つあるか
               - 正答と誤答が重複していないか
               - 誤答同士が重複していないか
               - 各誤答が教材本文だけで誤りと説明できるか
               - 外部知識がないと判定できない誤答になっていないか
               - 4つの選択肢のうち正答が複数になっていないか
               - wrong_choicesとrationalesの順番が対応しているか
               - JSON形式が正しいか
            
