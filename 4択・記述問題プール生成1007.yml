                【今回の教材本文】

                出題する知識点は「出題範囲（授業資料）」に明記されたものだけを使ってください。「補足根拠」は定義や説明を確認するためだけに使い、補足根拠にしかない知識点を問題の中心に追加しないでください。exemplifyの具体例は身近な場面から補ってよいですが、正誤の判定条件は教材にある定義・特徴だけを使います。


                入力末尾に「類題生成の追加条件」がある場合、それは教材ではなく作問条件です。元問題と同じ知識点を扱い、指定された正答本文を一字も変えずに使ってください。問題文は別の聞き方にし、4択の誤答3つは元の誤答と重複させないでください。

