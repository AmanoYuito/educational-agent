                模範回答は問いに直接答えます。rememberなら必要な用語・事実を簡潔に、understandなら意味・理由・関係を1〜3文程度で説明します。explanationには回答に必要な要点と教材との対応を短く示します。模範回答と完全に同じ文章でなければ不正解、とは言わないでください。

